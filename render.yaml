services:
  - type: web
    name: assistente-anamnese
    runtime: python
    # Pago: o plano gratuito dorme sem uso e derruba a geração no meio.
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    # O deploy só troca a instância quando a nova responde aqui.
    healthCheckPath: /saude/
    envVars:
      # Gerada automaticamente pelo Render.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Preencha estas no painel do Render (aba Environment):
      #   DATABASE_URL              -> connection string do Neon
      #   DJANGO_ALLOWED_HOSTS      -> ex: assistente-anamnese.onrender.com
      #   DJANGO_CSRF_TRUSTED_ORIGINS -> ex: https://assistente-anamnese.onrender.com
      #   IA_PROVEDOR / OPENAI_API_KEY / OPENAI_MODEL / OPENAI_MODEL_VERIFICACAO
      #   OPENAI_RACIOCINIO / OPENAI_RACIOCINIO_VERIFICACAO / IA_MODELOS (ou GEMINI_*)
      #   ADMIN_USUARIO / ADMIN_SENHA
      - key: PYTHON_VERSION
        value: "3.12.3"
